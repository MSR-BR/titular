<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memorial - Mario Reis - 2026</title>
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/layouts.css">
  </head>
  <body>
    <div class="presentation-frame">
      <main id="deck" class="deck-shell" aria-live="polite"></main>
    </div>

    <nav class="deck-controls" aria-label="Presentation controls">
      <button class="control-button" type="button" data-action="previous" aria-label="Previous slide" title="Previous slide">
        <span aria-hidden="true">‹</span>
      </button>
      <output class="slide-counter" id="slide-counter" aria-label="Slide number">1 / 1</output>
      <button class="control-button" type="button" data-action="next" aria-label="Next slide" title="Next slide">
        <span aria-hidden="true">›</span>
      </button>
    </nav>

    <div class="print-note" aria-hidden="true">Placeholder deck foundation - Change 002</div>

    <script src="./content/slides.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
